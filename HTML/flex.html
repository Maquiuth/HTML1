<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox</title>
    <link rel="stylesheet" href="styleFlex.css">
</head>
<body>
    <h2>DISPLAY BLOCK</h2>
    <div class="caja">Caja1</div>
    <div class="caja">Caja2</div>
    <div class="caja">Caja3</div>
    

    <h2>DISPLAY INLINE</h2>
    <div class="caja2">Caja1</div>
    <div class="caja2">Caja2</div>
    <div class="caja2">Caja3</div>

    <h2>DISPLAY INLINE-BLOCK</h2>
    <div class="Caja3">Caja1</div>
    <div class="Caja3">Caja2</div>
    <div class="Caja3">Caja3</div>

    <h2>FLEXBOX</h2>
    <div class="contenedor">
    <div class="caja4">Caja1</div>
    <div class="caja5">Caja2</div>
    <div class="caja6">Caja3</div>
    <div class="caja6">Caja4</div>
    <div class="caja6">Caja5</div>
    </div>
</body>
</html>
